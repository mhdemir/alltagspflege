name: Strato Deployment

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: 🚀 Deploy Website to Strato via SFTP
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: 📂 Upload dist to Strato
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 5020282487.ssh.w2.strato.hosting
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          source: "dist/**"
          target: "dist"
          strip_components: 1
          overwrite: true
