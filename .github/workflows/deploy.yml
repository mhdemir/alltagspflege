name: Strato SFTP Deployment

on:
  push:
    branches:
      - main  # Falls dein Branch 'master' heißt, bitte anpassen

jobs:
  deploy:
    name: 🚀 SFTP Deploy to Strato
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🚀 SFTP Upload
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: '5020282487.ssh.w2.strato.hosting'
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: './'      # Alles aus deinem GitHub-Projekt
          remote_path: '/'      # Zielordner bei Strato
          sftp_only: true       # Erzwingt SFTP (Sicher)
          # Diese Option verhindert den "Control Socket" / Host Key Fehler
          ssh_options: '-o StrictHostKeyChecking=no'
