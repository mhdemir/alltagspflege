name: Strato Deployment

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🚀 Deploy Website to Strato
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📂 Sync files to Strato
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        # Nur Inputs, die laut deiner Fehlermeldung gültig sind:
        server: 5020282487.ssh.w2.strato.hosting
        username: ${{ secrets.FTP_USER }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 22
        protocol: sftp
        local-dir: ./
        server-dir: ./
        # 'security' ist laut deiner Meldung ein gültiger Input, wir nutzen ihn für den Host-Key
        security: loose
