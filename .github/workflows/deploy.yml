name: Strato Deployment

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🚀 Deploy Website to Strato
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: npm ci && npm run build

      - name: Upload dist content
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 5020282487.ssh.w2.strato.hosting
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          source: "dist/**"
          target: "/dist/"
          strip_components: 1
          overwrite: true
